<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header class="header">
            <h1>News Portal</h1>
            <p class="header__subtitle">Choose a source and read the latest news</p>
        </header>
        <main class="main">
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer class="footer">
            <a
                class="footer__github"
                href="https://github.com/Plohish03"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub: Plohish03</a
            >
            <span class="footer__year">2026</span>
            <a class="footer__logo" href="https://rs.school/" target="_blank" rel="noopener noreferrer">
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" height="36" />
            </a>
            <p class="copyright">Copyright <a href="https://newsapi.org">NewsAPI</a></p>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
